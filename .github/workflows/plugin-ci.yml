# The shared build and check for every scm-js plugin repository. Each of them calls it
# with a workflow of its own that is six lines long:
#
#   name: CI
#   on:
#     push: { branches: [main], tags: ["v*"] }
#     pull_request:
#     schedule: [{ cron: "0 6 * * 1" }]   # type-check against the newest plugin API
#     workflow_dispatch:
#   permissions: { contents: write }
#   jobs:
#     ci:
#       uses: scm-js/.github/.github/workflows/plugin-ci.yml@main
#
# (the doubled `.github` is the workflows directory inside the organisation's `.github`
# repository) so what a plugin repository has to know about building itself lives in one
# place. It
# does three things:
#
#   1. **Checks.** `npm run typecheck` and `npm test`, both `--if-present`. Until this
#      existed only one plugin repository ran anything on a push, so a plugin's own
#      vitest suite only failed on the machine of whoever remembered to run it. A
#      scheduled run type-checks against the *newest* `@scm-js/plugin-api` instead of the
#      pinned one, so a contract that moved under a plugin shows up as a red run here.
#
#   2. **Builds `dist/plugin.js`** — one self-contained ES module, with esbuild, not
#      minified — by running the repository's own `npm run build`, and commits it when it
#      changed. That file is what the editor loads
#      (`plugin.json`'s `build`), and loading it costs one fetch: no TypeScript compiler
#      in the browser, no import graph to walk, and the plugin may use npm dependencies,
#      which the source path cannot resolve. A push made with GITHUB_TOKEN starts no
#      workflow run, so committing the build here cannot loop.
#
#   3. **On a `v*` tag, checks the committed build instead of writing one.** The bundle
#      the editor runs at a tag has to be the bundle that source builds to, or "read the
#      repository to see what it does" stops being true. esbuild's output is
#      deterministic, so a rebuild that differs means the tag carries something its
#      source does not produce, and that fails the run.
#
# The bundle deliberately carries no commit hash or build date: those would change the
# file on every run, which would defeat both the "only commit when it changed" rule and
# the reproducibility check above. What ties a bundle to its source is that they are in
# the same commit.
name: Plugin CI

on:
  workflow_call:
    inputs:
      node-version:
        description: "Node to build with."
        type: string
        default: "22"
      entry:
        description: "The plugin's source entry point."
        type: string
        default: "plugin.ts"
      outfile:
        description: "The bundle the manifest's `build` names."
        type: string
        default: "dist/plugin.js"
      esbuild-version:
        description: "Only used by the fallback below, for a repository with no `build` script of its own."
        type: string
        default: "0.28.2"

permissions:
  contents: write

jobs:
  ci:
    name: Check and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}
          cache: npm

      # `npm ci` needs a lockfile; a plugin small enough not to have one still installs.
      - name: Install
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install --no-audit --no-fund; fi

      # A plugin's lockfile pins the commit of `@scm-js/plugin-api` it last installed, so
      # a contract that moved is invisible until someone runs `npm update`. On a schedule
      # (and on a manual run) the tip is installed instead — nothing is saved, so this
      # only ever turns a run red, which is the point: drift is a failing check in the
      # repository it affects rather than a copy of the declarations quietly going stale.
      - name: Take the newest plugin API (scheduled runs)
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: npm install --no-save --no-audit --no-fund "github:scm-js/plugin-api#main"

      - name: Type-check
        run: npm run typecheck --if-present

      - name: Test
        run: npm test --if-present

      # The repository's own `build` script when it has one, so CI runs exactly what a
      # developer runs — which is what makes the tag check below meaningful, and lets a
      # plugin whose build is not one esbuild call (Trigger Script bundles Monaco) say so
      # in the one place a person would look. The fallback is for a plugin small enough
      # not to have a package.json script at all.
      - name: Build
        env:
          ENTRY: ${{ inputs.entry }}
          OUTFILE: ${{ inputs.outfile }}
          ESBUILD: ${{ inputs.esbuild-version }}
        run: |
          set -e
          if node -e 'process.exit(require("./package.json").scripts?.build ? 0 : 1)'; then
            npm run build
          else
            npx --yes "esbuild@$ESBUILD" "$ENTRY" \
              --bundle --format=esm --target=es2022 --platform=browser \
              --outfile="$OUTFILE"
          fi
          test -s "$OUTFILE"
          echo "$OUTFILE - $(wc -c < "$OUTFILE") bytes"

      # A tag is what the editor loads a pinned plugin from, so the build committed there
      # has to be the one its source produces. Nothing is written here: the run fails.
      - name: Check the committed build (tags)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          OUTFILE: ${{ inputs.outfile }}
        run: |
          if ! git diff --quiet -- "$OUTFILE"; then
            echo "::error::$OUTFILE at this tag is not what its source builds to. Build on main and tag that commit."
            git diff --stat -- "$OUTFILE"
            exit 1
          fi
          if [ -n "$(git status --porcelain -- "$OUTFILE")" ]; then
            echo "::error::$OUTFILE is not committed at this tag."
            exit 1
          fi
          echo "$OUTFILE matches its source."

      - name: Commit the build (main)
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        env:
          OUTFILE: ${{ inputs.outfile }}
        run: |
          if git diff --quiet -- "$OUTFILE" && [ -z "$(git status --porcelain -- "$OUTFILE")" ]; then
            echo "$OUTFILE is unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "$OUTFILE"
          git commit -m "Build $OUTFILE"
          git push origin HEAD:main
          echo "Committed $OUTFILE."
